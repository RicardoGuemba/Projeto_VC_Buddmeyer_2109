config_version: 1
log_level: INFO
log_file: logs/realtec_vision.log
streaming:
  source_type: usb
  video_path: videos/test.mp4
  usb_camera_index: 0
  rtsp_url: ''
  gige_ip: ''
  gige_port: 3956
  gentl_cti_path: ''
  gentl_device_index: 0
  gentl_max_dimension: 1920
  gentl_target_fps: 15.0
  max_frame_buffer_size: 30
  loop_video: true
  unhealthy_restart_after_s: 10.0
detection:
  model_path: model_best
  default_model: model_best
  confidence_threshold: 0.5
  max_detections: 10
  target_classes:
  - Embalagem
  inference_fps: 15
  device: auto
  segmentation_mask_threshold: 0.5
  segmentation_overlap_mask_area_threshold: 0.8
  segmentation_min_mask_pixels: 64
  pick_selection_method: area_then_conf
  pick_confidence_weight: 1.0
  pick_area_weight: 1.0
  plc_area_unit: cm2
  stable_frames: 3
  centroid_epsilon_px: 15.0
  vcp_offset_mm: 55.0
  vcp_reference: roi_top_mid
  inference_max_consecutive_errors: 5
preprocess:
  profile: default
  brightness: 0.0
  contrast: 0.0
  roi:
  - 181
  - 101
  - 277
  - 277
  roi_enabled: true
  roi_unit: px
  roi_calibration_mm_per_px: 1.0
cip:
  ip: 192.168.0.10
  port: 44818
  connection_timeout: 10.0
  timeout_ms: 10000
  retry_interval: 2.0
  max_retries: 3
  reconnect_backoff_cap_s: 60.0
  io_retries: 2
  simulated: false
  heartbeat_interval: 1.0
  auto_reconnect: true
robot_control:
  ack_timeout: 5.0
  pick_timeout: 30.0
  place_timeout: 30.0
  authorization_timeout: 30.0
  cycle_complete_timeout: 3.0
  bypass_authorization: false
reliability:
  production_mode: false
  auto_start_operation: false
  plc_sync_on_startup: true
  inhibit_power_management: true
  kiosk_fullscreen: false
  stream_auto_restart: true
  inference_auto_restart: true
  require_field_safety_tags: false
logging:
  max_bytes: 50000000
  backup_count: 10
tags:
  VisionReady: VisionCtrl_VisionReady
  VisionBusy: VisionCtrl_VisionBusy
  VisionError: VisionCtrl_VisionError
  VisionHeartbeat: VisionCtrl_Heartbeat
  ProductDetected: PRODUCT_DETECTED
  CentroidX: CENTROID_X
  CentroidY: CENTROID_Y
  CentroidAngle: CENTROID_ANGLE
  ObjectArea: OBJECT_AREA
  Confidence: CONFIDENCE
  DetectionCount: DETECTION_COUNT
  ProcessingTime: PROCESSING_TIME
  VisionEchoAck: VisionCtrl_EchoAck
  VisionDataSent: VisionCtrl_DataSent
  VisionReadyForNext: VisionCtrl_ReadyForNext
  SystemFault: SYSTEM_FAULT
  RobotAck: ROBOT_ACK
  RobotReady: ROBOT_READY
  RobotError: ROBOT_ERROR
  RobotBusy: RobotStatus_Busy
  RobotPickComplete: RobotStatus_PickComplete
  RobotPlaceComplete: RobotStatus_PlaceComplete
  PlcAuthorizeDetection: RobotCtrl_AuthorizeDetection
  PlcCycleStart: RobotCtrl_CycleStart
  PlcCycleComplete: RobotCtrl_CycleComplete
  PlcEmergencyStop: RobotCtrl_EmergencyStop
  PlcSystemMode: RobotCtrl_SystemMode
  Heartbeat: SystemStatus_Heartbeat
  SystemMode: SystemStatus_Mode
  SafetyGateClosed: Safety_GateClosed
  SafetyAreaClear: Safety_AreaClear
  SafetyLightCurtainOK: Safety_LightCurtainOK
  SafetyEmergencyStop: Safety_EmergencyStop
output:
  rtsp_enabled: true
  http_port: 8080
  http_path: /stream
